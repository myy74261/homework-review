spring:
  application:
    name: review-desk
  datasource:
    url: jdbc:h2:file:./data/review-desk
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  thymeleaf:
    cache: false
  web:
    resources:
      cache:
        period: 0

server:
  port: 8080
  address: 0.0.0.0
  servlet:
    encoding:
      charset: UTF-8
      force: true
    session:
      cookie:
        http-only: true
        same-site: lax

logging:
  level:
    org.hibernate.SQL: warn
