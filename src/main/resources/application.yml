spring:
  application:
    name: ${SPRING_APPLICATION_NAME:review-desk}
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/review-desk}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:25MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:220MB}
  web:
    resources:
      cache:
        period: 0

server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}
  servlet:
    encoding:
      charset: UTF-8
      force: true
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
  error:
    whitelabel:
      enabled: false

review-desk:
  storage:
    root: ${UPLOAD_ROOT:./data/uploads}
  ai:
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    model: ${AI_MODEL:deepseek-chat}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:30}
    settings-secret: ${AI_SETTINGS_SECRET:review-desk-local-dev-secret}
  ui:
    show-demo-credentials: ${SHOW_DEMO_CREDENTIALS:true}
  demo:
    teacher-username: ${DEMO_TEACHER_USERNAME:chen}
    teacher-password: ${DEMO_TEACHER_PASSWORD:Teach1234}
    teacher-name: ${DEMO_TEACHER_NAME:陈老师}
    student-username: ${DEMO_STUDENT_USERNAME:lin}
    student-password: ${DEMO_STUDENT_PASSWORD:Student1234}
    student-name: ${DEMO_STUDENT_NAME:林清和}
    student-number: ${DEMO_STUDENT_NUMBER:20230116}

logging:
  level:
    org.hibernate.SQL: warn
