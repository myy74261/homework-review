<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2eee5">
  <title th:text="${errorTitle + ' · 明鉴'}">页面暂时无法打开 · 明鉴</title>
  <link rel="stylesheet" th:href="@{/css/review.css}">
  <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>
<body class="portal-page">
  <main class="error-shell">
    <a class="brand error-brand" th:href="@{/}">
      <span class="brand-seal" aria-hidden="true">鉴</span>
      <span class="brand-copy">
        <strong>明鉴</strong>
        <small>教师作业审核平台</small>
      </span>
    </a>
    <section class="error-card">
      <span class="error-code" th:text="${statusCode}">405</span>
      <p class="eyebrow">操作提示</p>
      <h1 th:text="${errorTitle}">操作方式不正确</h1>
      <p th:text="${errorMessage}">
        提交入口不能直接打开。请返回作业页重新填写并提交。
      </p>
      <div class="error-actions">
        <a class="hero-action" th:href="@{/}">返回我的工作台</a>
        <button type="button" onclick="history.back()">返回上一页</button>
      </div>
    </section>
  </main>
</body>
</html>
