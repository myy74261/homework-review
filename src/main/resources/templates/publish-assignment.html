<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>发布作业 · 明鉴</title>
  <link rel="stylesheet" th:href="@{/css/review.css}">
  <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>
<body class="portal-page">
  <header class="topbar portal-topbar">
    <a class="brand" th:href="@{/teacher}" aria-label="返回明鉴教师课堂">
      <span class="brand-seal" aria-hidden="true">鉴</span>
      <span class="brand-copy">
        <strong>明鉴</strong>
        <small>教师作业审核平台</small>
      </span>
    </a>
    <nav class="portal-nav" aria-label="教师端主导航">
      <a th:href="@{/teacher}">我的课堂</a>
      <a class="is-active" th:href="@{/teacher/assignments/new}">发布作业</a>
    </nav>
    <div class="topbar-end">
      <span class="role-chip" th:text="${currentAccount.displayName + ' · 教师'}">陈老师 · 教师</span>
      <button class="teacher-avatar" type="button" aria-label="教师个人中心"
              th:text="${#strings.substring(currentAccount.displayName, 0, 1)}">陈</button>
      <form class="logout-form" th:action="@{/logout}" method="post">
        <button type="submit">退出</button>
      </form>
    </div>
  </header>

  <main class="publish-main">
    <a class="back-to-class" th:href="@{/teacher}">← 返回课堂</a>
    <section class="publish-intro">
      <p class="eyebrow">发布作业</p>
      <h1>先定义任务，再开始收集证据</h1>
      <p>评分量规会进入学生提交页面，并成为后续共性问题汇总的判断框架。</p>
    </section>

    <form class="publish-form" th:action="@{/teacher/assignments}" th:object="${form}" method="post">
      <div class="form-errors" th:if="${#fields.hasAnyErrors()}">
        <p th:each="error : ${#fields.allErrors()}" th:text="${error}">请检查表单内容。</p>
      </div>

      <section class="form-section">
        <div class="form-section-head">
          <span>01</span>
          <div>
            <h2>作业信息</h2>
            <p>学生将看到以下内容。</p>
          </div>
        </div>
        <div class="form-grid">
          <label class="field field-wide">
            <span>作业名称</span>
            <input type="text" th:field="*{title}" autocomplete="off">
            <small class="field-error" th:errors="*{title}"></small>
          </label>
          <label class="field">
            <span>课程名称</span>
            <input type="text" th:field="*{courseName}">
            <small class="field-error" th:errors="*{courseName}"></small>
          </label>
          <label class="field">
            <span>发布课堂</span>
            <select th:field="*{classroomId}">
              <option th:each="classroom : ${classrooms}"
                      th:value="${classroom.id}"
                      th:text="${classroom.name + ' · ' + classroom.courseName}">
                传播学方法课 · 2026 秋
              </option>
            </select>
            <small class="field-error" th:errors="*{classroomId}"></small>
          </label>
          <label class="field">
            <span>截止时间</span>
            <input type="datetime-local" th:field="*{dueAt}">
            <small class="field-error" th:errors="*{dueAt}"></small>
          </label>
          <label class="field">
            <span>作业形式</span>
            <select th:field="*{submissionFormat}">
              <option value="DOCUMENT">文档</option>
              <option value="CODE">代码</option>
              <option value="SCREENSHOT">截图 / 设计</option>
              <option value="MIXED">混合形式</option>
            </select>
          </label>
          <label class="field">
            <span>AI 使用政策</span>
            <select th:field="*{aiPolicy}">
              <option value="NOT_ALLOWED">不允许使用</option>
              <option value="ASSISTED_ALLOWED">允许辅助使用</option>
              <option value="GENERATION_ALLOWED">允许生成内容并声明</option>
            </select>
          </label>
          <label class="field field-wide">
            <span>作业要求</span>
            <textarea rows="5" th:field="*{instructions}"></textarea>
            <small class="field-error" th:errors="*{instructions}"></small>
          </label>
        </div>
        <div class="declaration-options">
          <label><input type="checkbox" th:field="*{aiDeclarationRequired}"> 要求学生声明 AI 使用情况</label>
          <label><input type="checkbox" th:field="*{sourceDeclarationRequired}"> 要求学生声明文献与数据来源</label>
          <label><input type="checkbox" th:field="*{appealAllowed}"> 允许学生对最终反馈发起申诉</label>
        </div>
      </section>

      <section class="form-section">
        <div class="form-section-head">
          <span>02</span>
          <div>
            <h2>评分量规</h2>
            <p>支持 1–10 个维度，总分必须为 100 分。</p>
          </div>
          <span class="rubric-total">总分 <strong id="rubricTotal">100</strong> / 100</span>
        </div>
        <div class="rubric-form-list" id="rubricFormList">
          <div class="rubric-form-row" data-rubric-row th:each="rubric, stat : *{rubrics}">
            <span class="rubric-order" data-rubric-index th:text="${stat.count}">1</span>
            <label class="field">
              <span>维度名称</span>
              <input type="text" th:field="*{rubrics[__${stat.index}__].name}">
            </label>
            <label class="field points-field">
              <span>分值</span>
              <input type="number" min="1" max="100" data-points
                     th:field="*{rubrics[__${stat.index}__].points}">
            </label>
            <label class="field">
              <span>观察说明</span>
              <input type="text" th:field="*{rubrics[__${stat.index}__].description}">
            </label>
            <button class="remove-rubric" type="button" aria-label="删除评分维度">×</button>
          </div>
        </div>
        <button class="add-rubric" id="addRubric" type="button">＋ 增加评分维度</button>
      </section>

      <div class="publish-actions">
        <a class="secondary-link" th:href="@{/teacher}">取消</a>
        <button class="submit-assignment" type="submit">发布作业并开放提交</button>
      </div>
    </form>
  </main>
  <script th:src="@{/js/publish-assignment.js}" defer></script>
</body>
</html>
