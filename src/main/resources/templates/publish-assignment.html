<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>发布作业 · 明鉴</title>
  <link rel="stylesheet" th:href="@{/css/review.css}">
  <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>
<body class="portal-page">
  <header class="topbar portal-topbar">
    <a class="brand" th:href="@{/teacher}" aria-label="返回明鉴教师课堂">
      <span class="brand-seal" aria-hidden="true">鉴</span>
      <span class="brand-copy">
        <strong>明鉴</strong>
        <small>教师作业审核平台</small>
      </span>
    </a>
    <nav class="portal-nav" aria-label="教师端主导航">
      <a th:href="@{/teacher}">我的课堂</a>
      <a class="is-active" th:href="@{/teacher/assignments/new}">发布作业</a>
    </nav>
    <div class="topbar-end">
      <span class="role-chip" th:text="${currentAccount.displayName + ' · 教师'}">陈老师 · 教师</span>
      <button class="teacher-avatar" type="button" aria-label="教师个人中心"
              th:text="${#strings.substring(currentAccount.displayName, 0, 1)}">陈</button>
      <form class="logout-form" th:action="@{/logout}" method="post">
        <button type="submit">退出</button>
      </form>
    </div>
  </header>

  <main class="publish-main">
    <a class="back-to-class" th:href="@{/teacher}">← 返回课堂</a>
    <section class="publish-intro">
      <p class="eyebrow">发布作业</p>
      <h1>先定义任务，再开始收集证据</h1>
      <p>评分量规会进入学生提交页面，并成为后续共性问题汇总的判断框架。</p>
    </section>

    <form class="publish-form" th:action="@{/teacher/assignments}" th:object="${form}" method="post">
      <div class="form-errors" th:if="${#fields.hasAnyErrors()}">
        <p th:each="error : ${#fields.allErrors()}" th:text="${error}">请检查表单内容。</p>
      </div>

      <section class="form-section">
        <div class="form-section-head">
          <span>01</span>
          <div>
            <h2>作业信息</h2>
            <p>学生将看到以下内容。</p>
          </div>
        </div>
        <div class="form-grid">
          <label class="field field-wide">
            <span>作业名称</span>
            <input type="text" th:field="*{title}" autocomplete="off">
            <small class="field-error" th:errors="*{title}"></small>
          </label>
          <label class="field">
            <span>课程名称</span>
            <input type="text" th:field="*{courseName}">
            <small class="field-error" th:errors="*{courseName}"></small>
          </label>
          <label class="field">
            <span>发布课堂</span>
            <select th:field="*{classroomId}">
              <option th:each="classroom : ${classrooms}"
                      th:value="${classroom.id}"
                      th:text="${classroom.name + ' · ' + classroom.courseName}">
                传播学方法课 · 2026 秋
              </option>
            </select>
            <small class="field-error" th:errors="*{classroomId}"></small>
          </label>
          <label class="field">
            <span>截止时间</span>
            <input type="datetime-local" th:field="*{dueAt}">
            <small class="field-error" th:errors="*{dueAt}"></small>
          </label>
          <label class="field field-wide">
            <span>作业要求</span>
            <textarea rows="5" th:field="*{instructions}"></textarea>
            <small class="field-error" th:errors="*{instructions}"></small>
          </label>
        </div>
      </section>

      <section class="form-section">
        <div class="form-section-head">
          <span>02</span>
          <div>
            <h2>评分量规</h2>
            <p>四个维度合计必须为 100 分。</p>
          </div>
        </div>
        <div class="rubric-form-list">
          <div class="rubric-form-row">
            <span class="rubric-order">1</span>
            <label class="field"><span>维度名称</span><input type="text" th:field="*{criterion1Name}"></label>
            <label class="field points-field"><span>分值</span><input type="number" min="1" max="100" th:field="*{criterion1Points}"></label>
            <label class="field"><span>观察说明</span><input type="text" th:field="*{criterion1Description}"></label>
          </div>
          <div class="rubric-form-row">
            <span class="rubric-order">2</span>
            <label class="field"><span>维度名称</span><input type="text" th:field="*{criterion2Name}"></label>
            <label class="field points-field"><span>分值</span><input type="number" min="1" max="100" th:field="*{criterion2Points}"></label>
            <label class="field"><span>观察说明</span><input type="text" th:field="*{criterion2Description}"></label>
          </div>
          <div class="rubric-form-row">
            <span class="rubric-order">3</span>
            <label class="field"><span>维度名称</span><input type="text" th:field="*{criterion3Name}"></label>
            <label class="field points-field"><span>分值</span><input type="number" min="1" max="100" th:field="*{criterion3Points}"></label>
            <label class="field"><span>观察说明</span><input type="text" th:field="*{criterion3Description}"></label>
          </div>
          <div class="rubric-form-row">
            <span class="rubric-order">4</span>
            <label class="field"><span>维度名称</span><input type="text" th:field="*{criterion4Name}"></label>
            <label class="field points-field"><span>分值</span><input type="number" min="1" max="100" th:field="*{criterion4Points}"></label>
            <label class="field"><span>观察说明</span><input type="text" th:field="*{criterion4Description}"></label>
          </div>
        </div>
      </section>

      <div class="publish-actions">
        <a class="secondary-link" th:href="@{/teacher}">取消</a>
        <button class="submit-assignment" type="submit">发布作业并开放提交</button>
      </div>
    </form>
  </main>
</body>
</html>
