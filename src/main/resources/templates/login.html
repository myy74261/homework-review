<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 明鉴</title>
  <link rel="stylesheet" th:href="@{/css/review.css}">
  <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>
<body class="portal-page auth-page">
  <main class="auth-shell">
    <section class="auth-story">
      <a class="brand" th:href="@{/login}" aria-label="明鉴登录">
        <span class="brand-seal" aria-hidden="true">鉴</span>
        <span class="brand-copy">
          <strong>明鉴</strong>
          <small>作业审核平台</small>
        </span>
      </a>
      <div>
          <p class="eyebrow">教学与反馈</p>
          <h1>作业审核与<br>学习反馈</h1>
          <p>教师创建课堂、发布作业并完成审核；学生加入课堂、提交作业并查看反馈。</p>
      </div>
      <div class="auth-flow">
        <span>发布作业</span><i>→</i><span>学生提交</span><i>→</i><span>教师审核</span><i>→</i><span>导出备课</span>
      </div>
    </section>

    <section class="auth-card">
      <div class="auth-card-head">
        <p class="eyebrow">账号登录</p>
        <h2>登录账号</h2>
        <p>教师和学生使用同一个登录入口。</p>
      </div>

      <p class="error-banner" th:if="${param.error}">账号或密码不正确，请重新输入。</p>
      <p class="success-banner" th:if="${param.logout}">你已安全退出登录。</p>
      <p class="success-banner" th:if="${param.registered}">
        账号创建成功，请使用新账号登录。
      </p>

      <form class="auth-form" th:action="@{/login}" method="post">
        <label class="field">
          <span>账号</span>
          <input type="text" name="username" autocomplete="username" required autofocus>
        </label>
        <label class="field">
          <span>密码</span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="auth-submit" type="submit">登录</button>
      </form>

      <p class="auth-switch">还没有账号？<a th:href="@{/register}">创建教师或学生账号</a></p>

      <div class="demo-accounts" th:if="${showDemoCredentials}">
        <span>演示账号</span>
        <div>
          <strong>教师</strong>
          <code th:text="${demoTeacherUsername + ' / ' + demoTeacherPassword}">chen / Teach1234</code>
        </div>
        <div>
          <strong>学生</strong>
          <code th:text="${demoStudentUsername + ' / ' + demoStudentPassword}">lin / Student1234</code>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
