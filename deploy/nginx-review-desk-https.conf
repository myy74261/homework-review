server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 47-114-60-5.sslip.io;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    ssl_certificate /etc/letsencrypt/live/47-114-60-5.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/47-114-60-5.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# 保留原来的 IP 入口，并统一跳转到有受信任证书的 HTTPS 地址。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://47-114-60-5.sslip.io$request_uri;
}
